<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الطبية والصيدلانية v2.1</title>
    <style>
        :root {
            --primary: #0d5c46;
            --primary-dark: #073b2d;
            --accent: #d97706;
            --bg-light: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            direction: rtl;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 1.6rem;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 10px;
        }

        /* Tabs styling */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
        }

        .tab-btn {
            padding: 10px 18px;
            border: none;
            background: #e2e8f0;
            color: #475569;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13, 92, 70, 0.1);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        button.btn-submit {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        button.btn-submit:hover {
            background-color: #b45309;
        }

        .result-box {
            margin-top: 15px;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 15px;
            color: #166534;
            display: none;
        }

        .result-box.active {
            display: block;
        }

        .badge {
            background-color: #dbeafe;
            color: #1e40af;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>🩺 لوحة التحكم الطبية والصيدلانية</h1>
        <p>منصة الدعم السريري وحساب الجرعات للأطفال — النسخة v2.1</p>
    </header>

    <div class="container">
        <!-- قسم حاسبة جرعات الأطفال المحدث -->
        <div class="card">
            <div class="card-title">
                👶 حاسبة جرعات الأطفال وتقييم الوزن
            </div>

            <!-- التبويبات -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('age-tab', this)">حساب الوزن حسب العمر</button>
                <button class="tab-btn" onclick="switchTab('weight-tab', this)">حساب الجرعة المباشرة بالوزن</button>
            </div>

            <!-- تبويب 1: تقدير الوزن بناءً على العمر -->
            <div id="age-tab" class="tab-content active">
                <div class="grid-2">
                    <div class="form-group">
                        <label for="age-unit">الوحدة الزمنية:</label>
                        <select id="age-unit" onchange="calculateWeightFromAge()">
                            <option value="months">أشهر (1 - 12 شهر)</option>
                            <option value="years" selected>سنوات (1 - 12 سنة)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="child-age">عمر الطفل:</label>
                        <input type="number" id="child-age" min="1" max="144" placeholder="أدخل العمر" oninput="calculateWeightFromAge()">
                    </div>
                </div>

                <div id="age-weight-result" class="result-box">
                    <strong>الوزن التقريبي المتوقع:</strong> <span id="estimated-weight-val">0</span> كجم
                    <br>
                    <small style="color: #4b5563;">* تعتمد على معادلات APLS للحلول السريعة في الطوارئ.</small>
                    <div style="margin-top: 10px;">
                        <button class="btn-submit" style="background-color: var(--primary);" onclick="useEstimatedWeight()">استخدام هذا الوزن للحساب ⬇️</button>
                    </div>
                </div>
            </div>

            <!-- تبويب 2: حساب الجرعة بالوزن مباشرة -->
            <div id="weight-tab" class="tab-content">
                <div class="grid-2">
                    <div class="form-group">
                        <label for="child-weight">وزن الطفل (كجم):</label>
                        <input type="number" id="child-weight" placeholder="مثال: 12" step="0.1">
                    </div>
                    <div class="form-group">
                        <label for="dose-mg-kg">الجرعة المطلوبة (ملجم / كجم / يوم):</label>
                        <input type="number" id="dose-mg-kg" placeholder="مثال: 15">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="syrup-conc">تركيز الدواء (ملجم لكل 5 مل):</label>
                        <input type="number" id="syrup-conc" placeholder="مثال: 250">
                    </div>
                    <div class="form-group">
                        <label for="frequency">عدد الجرعات يومياً:</label>
                        <select id="frequency">
                            <option value="1">مرة واحدة يومياً (Every 24h)</option>
                            <option value="2">مرتان يومياً (Every 12h)</option>
                            <option value="3" selected>3 مرات يومياً (Every 8h)</option>
                            <option value="4">4 مرات يومياً (Every 6h)</option>
                        </select>
                    </div>
                </div>

                <button class="btn-submit" onclick="calculateDose()">احسب الجرعة الدقيقة</button>

                <div id="dose-result" class="result-box">
                    <strong>إجمالي الجرعة اليومية:</strong> <span id="total-dose-mg">0</span> ملجم<br>
                    <strong>الجرعة في المرة الواحدة:</strong> <span id="single-dose-ml">0</span> مل (<span id="single-dose-mg">0</span> ملجم)<br>
                </div>
            </div>
        </div>
    </div>

    <script>
        // التبديل بين التبويبات
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        // حساب الوزن التقريبي بناءً على العمر
        function calculateWeightFromAge() {
            const age = parseFloat(document.getElementById('child-age').value);
            const unit = document.getElementById('age-unit').value;
            const resultBox = document.getElementById('age-weight-result');
            const weightValSpan = document.getElementById('estimated-weight-val');

            if (isNaN(age) || age <= 0) {
                resultBox.classList.remove('active');
                return;
            }

            let estimatedWeight = 0;

            if (unit === 'months') {
                // للأطفال أقل من سنة (بالأشهر): (العمر / 2) + 4
                estimatedWeight = (age / 2) + 4;
            } else {
                // للأطفال بالسنين
                if (age >= 1 && age <= 5) {
                    // من 1 إلى 5 سنوات: (العمر × 2) + 8
                    estimatedWeight = (age * 2) + 8;
                } else if (age > 5 && age <= 12) {
                    // من 6 إلى 12 سنة: (العمر × 3) + 7
                    estimatedWeight = (age * 3) + 7;
                } else {
                    // أطفال أكبر من 12 سنة
                    estimatedWeight = (age * 3) + 5;
                }
            }

            weightValSpan.innerText = estimatedWeight.toFixed(1);
            resultBox.classList.add('active');
        }

        // نقل الوزن المحسوب لتبويب الجرعات
        function useEstimatedWeight() {
            const estimatedWeight = document.getElementById('estimated-weight-val').innerText;
            document.getElementById('child-weight').value = estimatedWeight;

            // التبديل لتبويب حساب الجرعة
            const weightTabBtn = document.querySelectorAll('.tab-btn')[1];
            switchTab('weight-tab', weightTabBtn);
        }

        // حساب الجرعة بالملجم والمل
        function calculateDose() {
            const weight = parseFloat(document.getElementById('child-weight').value);
            const dosePerKg = parseFloat(document.getElementById('dose-mg-kg').value);
            const concMg = parseFloat(document.getElementById('syrup-conc').value);
            const freq = parseInt(document.getElementById('frequency').value);
            const resultBox = document.getElementById('dose-result');

            if (!weight || !dosePerKg || !concMg) {
                alert('يرجى إدخال كافة البيانات المطلوبة لحساب الجرعة.');
                return;
            }

            const totalDailyMg = weight * dosePerKg;
            const singleDoseMg = totalDailyMg / freq;
            
            // حساب الميليلترات (التركيز المعياري 5 مل)
            const singleDoseMl = (singleDoseMg * 5) / concMg;

            document.getElementById('total-dose-mg').innerText = totalDailyMg.toFixed(1);
            document.getElementById('single-dose-mg').innerText = singleDoseMg.toFixed(1);
            document.getElementById('single-dose-ml').innerText = singleDoseMl.toFixed(1);

            resultBox.classList.add('active');
        }
    </script>
</body>
</html>
