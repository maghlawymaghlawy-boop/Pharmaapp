<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم الطبية والصيدلانية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #ccfbf1;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius-lg: 16px;
      --radius-md: 12px;
      --shadow-sm: 0 2px 4px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 15px -3px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 40px; }

    /* Header */
    header { 
      background: linear-gradient(135deg, #115e59 0%, #0f766e 100%); 
      color: white; 
      padding: 16px 20px; 
      position: sticky; 
      top: 0; 
      z-index: 100; 
      box-shadow: 0 4px 20px rgba(15, 118, 110, 0.25);
    }
    .header-content { max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    header p { font-size: 11px; color: var(--primary-light); font-weight: 600; margin-top: 2px; }

    .container { max-width: 800px; margin: 20px auto; padding: 0 16px; }

    /* Cards */
    .card { 
      background: var(--card-bg); 
      border-radius: var(--radius-lg); 
      padding: 20px; 
      margin-bottom: 16px; 
      border: 1px solid var(--border-color); 
      box-shadow: var(--shadow-sm);
    }

    /* Grid Setup */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
    @media (min-width: 600px) { .grid { grid-template-columns: repeat(4, 1fr); } }

    /* Modern Dashboard Action Cards */
    .btn-card { 
      background: #ffffff; 
      border: 1px solid var(--border-color); 
      border-radius: var(--radius-md); 
      padding: 18px 12px; 
      text-align: center; 
      cursor: pointer; 
      transition: all 0.23s ease; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
    .btn-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: #cbd5e1; }
    .btn-card:active { transform: scale(0.96); }

    /* Dynamic Card Accent Colors */
    .btn-card.drug { border-top: 4px solid #0f766e; }
    .btn-card.alt { border-top: 4px solid #047857; }
    .btn-card.derma { border-top: 4px solid #0369a1; }
    .btn-card.algo { border-top: 4px solid #b45309; }

    .btn-card .icon { font-size: 28px; margin-bottom: 8px; display: block; }
    .btn-card .title { font-size: 13px; font-weight: 800; color: var(--text-main); display: block; }

    /* Form Controls & Inputs */
    .input-group { display: flex; gap: 10px; margin-top: 12px; }
    input[type="text"], input[type="password"], input[type="number"] { 
      flex: 1; 
      padding: 12px 14px; 
      border: 1.5px solid #cbd5e1; 
      border-radius: var(--radius-md); 
      font-size: 13px; 
      outline: none; 
      background: #ffffff;
      transition: all 0.2s;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15); }

    button.action-btn { 
      background: var(--primary); 
      color: white; 
      border: none; 
      padding: 12px 20px; 
      border-radius: var(--radius-md); 
      font-size: 13px; 
      font-weight: 700; 
      cursor: pointer; 
      white-space: nowrap; 
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(15, 118, 110, 0.2);
    }
    button.action-btn:hover { background: var(--primary-dark); }
    button.action-btn:active { transform: scale(0.96); }

    .back-btn { 
      background: #ffffff; 
      color: var(--text-main); 
      border: 1px solid var(--border-color); 
      padding: 8px 16px; 
      border-radius: 20px; 
      font-size: 12px; 
      font-weight: 700;
      cursor: pointer; 
      margin-bottom: 14px; 
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }
    .back-btn:active { transform: scale(0.95); background: #f1f5f9; }

    /* Elegant Result Containers */
    .result-box { 
      background: #ffffff; 
      border-radius: var(--radius-lg); 
      padding: 18px; 
      border: 1px solid var(--border-color); 
      margin-top: 14px; 
      font-size: 13px; 
      line-height: 1.7; 
      box-shadow: var(--shadow-sm);
    }
    .result-box h3 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }

    .badge { 
      background: var(--primary-light); 
      color: var(--primary-dark); 
      font-size: 10px; 
      padding: 3px 10px; 
      border-radius: 20px; 
      font-weight: 800; 
    }

    .loading { 
      text-align: center; 
      color: var(--primary); 
      font-weight: 700; 
      padding: 20px; 
      font-size: 13px; 
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border-color);
      margin-top: 14px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div>
        <h1>🩺 لوحة التحكم الطبية والصيدلانية</h1>
        <p>منصة الدعم السريري والتجميلي السريعة</p>
      </div>
      <span class="badge" style="background: rgba(255,255,255,0.15); color: #ffffff;">v2.0 Pro</span>
    </div>
  </header>

  <div class="container">

    <!-- API Key Section -->
    <div id="apiKeySection" class="card" style="background-color: #fffbeb; border-color: #fef08a;">
      <span style="font-size: 12px; font-weight: bold; color: #854d0e;">⚠️ إعداد مفتاح Gemini API (مطلوب مرة واحدة):</span>
      <div class="input-group">
        <input type="password" id="apiKeyInput" placeholder="الصق المفتاح هنا..." />
        <button class="action-btn" style="background-color: #a16207;" onclick="saveApiKey()">حفظ المفتاح</button>
      </div>
    </div>

    <!-- MAIN DASHBOARD PAGE -->
    <div id="pageDashboard">
      <div class="card">
        <h2 style="font-size: 14px; font-weight: 800; color: #1e293b; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px;">الأقسام الرئيسية</h2>
        <div class="grid">
          <div class="btn-card drug" onclick="openPage('pageDrug')">
            <span class="icon">💊</span>
            <span class="title">المساعد الدوائي</span>
          </div>
          <div class="btn-card alt" onclick="openPage('pageAlt')">
            <span class="icon">🔄</span>
            <span class="title">المثائل والبدائل</span>
          </div>
          <div class="btn-card derma" onclick="openPage('pageDerma')">
            <span class="icon">✨</span>
            <span class="title">الشعر والبشرة</span>
          </div>
          <div class="btn-card algo" onclick="openPage('pageAlgo')">
            <span class="icon">🌿</span>
            <span class="title">الخوارزميات</span>
          </div>
        </div>
      </div>
    </div>

    <!-- PAGE 1: DRUG ASSISTANT -->
    <div id="pageDrug" class="page-content hidden">
      <button class="back-btn" onclick="showDashboard()">➡️ العودة للرئيسية</button>
      <div class="card">
        <h2 style="font-size: 14px; font-weight: 800; color: #0f766e; margin-bottom: 4px;">💊 المساعد الدوائي</h2>
        <div class="input-group">
          <input type="text" id="drugSearchInput" placeholder="اكتب اسم الدواء أو السؤال الطبية..." />
          <button class="action-btn" onclick="askGeminiDrug()">بحث</button>
        </div>
      </div>
      <div id="aiResultsDrug"></div>
    </div>

    <!-- PAGE 2: ALTERNATIVES -->
    <div id="pageAlt" class="page-content hidden">
      <button class="back-btn" onclick="showDashboard()">➡️ العودة للرئيسية</button>
      <div class="card">
        <h2 style="font-size: 14px; font-weight: 800; color: #047857; margin-bottom: 4px;">🔄 المثائل والبدائل</h2>
        <div class="input-group">
          <input type="text" id="altSearchInput" placeholder="اسم الدواء..." />
          <button class="action-btn" style="background-color: #047857;" onclick="askGeminiAlternatives()">عرض البدائل</button>
        </div>
      </div>
      <div id="aiResultsAlt"></div>
    </div>

    <!-- PAGE 3: DERMA -->
    <div id="pageDerma" class="page-content hidden">
      <button class="back-btn" onclick="showDashboard()">➡️ العودة للرئيسية</button>
      <div class="card">
        <h2 style="font-size: 14px; font-weight: 800; color: #0369a1; margin-bottom: 4px;">✨ الشعر والبشرة</h2>
        <div class="input-group">
          <input type="text" id="dermaSearchInput" placeholder="وصف المشكلة الجلدية..." />
          <button class="action-btn" style="background-color: #0369a1;" onclick="askGeminiDerma()">تحليل</button>
        </div>
      </div>
      <div id="aiResultsDerma"></div>
    </div>

    <!-- PAGE 4: ALGORITHMS -->
    <div id="pageAlgo" class="page-content hidden">
      <button class="back-btn" onclick="showDashboard()">➡️ العودة للرئيسية</button>
      <div class="card">
        <h2 style="font-size: 14px; font-weight: 800; color: #b45309; margin-bottom: 4px;">🌿 الخوارزميات الطبية</h2>
        <div class="input-group">
          <input type="text" id="algoSearchInput" placeholder="اسم الحالة الطبية..." />
          <button class="action-btn" style="background-color: #b45309;" onclick="askGeminiAlgorithm()">رسم الخريطة</button>
        </div>
      </div>
      <div id="aiResultsAlgo"></div>
    </div>

  </div>

  <script>
    // التأكد التام من عمل النص البرمجي
    window.onload = function() {
      const savedKey = localStorage.getItem('gemini_api_key');
      if(savedKey) {
        document.getElementById('apiKeyInput').value = savedKey;
        document.getElementById('apiKeySection').style.display = 'none';
      }
    };

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if(key) {
        localStorage.setItem('gemini_api_key', key);
        document.getElementById('apiKeySection').style.display = 'none';
        alert('تم حفظ المفتاح بنجاح! 🚀');
      } else { 
        alert('من فضلك أدخل مفتاح صحيح.'); 
      }
    }

    function openPage(pageId) {
      document.getElementById('pageDashboard').classList.add('hidden');
      document.querySelectorAll('.page-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(pageId).classList.remove('hidden');
    }

    function showDashboard() {
      document.querySelectorAll('.page-content').forEach(el => el.classList.add('hidden'));
      document.getElementById('pageDashboard').classList.remove('hidden');
    }

    function getApiKey() {
      const key = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();
      if(!key) {
        alert('⚠️ برجاء إدخال وحفظ Gemini API Key أولاً.');
        document.getElementById('apiKeySection').style.display = 'block';
        return null;
      }
      return key;
    }

    async function fetchGemini(promptText) {
      const apiKey = getApiKey();
      if(!apiKey) return null;

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }]
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message || 'خطأ في API');
      if (!data.candidates || !data.candidates[0]) throw new Error('لم يتم استلام استجابة صحيحة.');

      let rawText = data.candidates[0].content.parts[0].text.trim().replace(/```json/g, '').replace(/```/g, '').trim();
      return JSON.parse(rawText.substring(rawText.indexOf('{'), rawText.lastIndexOf('}') + 1));
    }

    async function askGeminiDrug() {
      const query = document.getElementById('drugSearchInput').value.trim();
      if(!query) { alert("برجاء كتابة اسم الدواء أولاً!"); return; }
      
      const container = document.getElementById('aiResultsDrug');
      container.innerHTML = `<div class="loading">⏳ جارِ تحليل السؤال بـ Gemini...</div>`;

      try {
        const prompt = `أنت صيدلي خبير. قم بتحليل الطلب: "${query}". أرجع JSON فقط بالصيغة: {"name": "اسم المنتج", "activeIngredients": ["المادة الفعالة"], "indications": "دواعي الاستعمال", "dosageAndUsage": "الجرعة"}`;
        const resJson = await fetchGemini(prompt);
        if(!resJson) return;

        container.innerHTML = `
          <div class="result-box">
            <h3 style="font-size:15px; color:#0f766e; font-weight:800;">${resJson.name} <span class="badge">Gemini AI</span></h3>
            <p style="margin-top:8px;"><strong>🧪 المكونات:</strong> ${resJson.activeIngredients.join(', ')}</p>
            <p style="margin-top:6px;"><strong>🎯 دواعي الاستعمال:</strong> ${resJson.indications}</p>
            <p style="margin-top:6px;"><strong>💊 الجرعة:</strong> ${resJson.dosageAndUsage}</p>
          </div>`;
      } catch (err) { alert("خطأ: " + err.message); container.innerHTML = ''; }
    }

    async function askGeminiAlternatives() {
      const query = document.getElementById('altSearchInput').value.trim();
      if(!query) { alert("برجاء كتابة اسم الدواء أولاً!"); return; }
      
      const container = document.getElementById('aiResultsAlt');
      container.innerHTML = `<div class="loading">⏳ جارِ استخراج البدائل...</div>`;

      try {
        const prompt = `أنت صيدلي خبير بالسوق المصري. استخرج المثائل والبدائل للدواء: "${query}". أرجع JSON بالشكل: {"generics": ["مثيل 1"], "substitutes": ["بديل 1"]}`;
        const resJson = await fetchGemini(prompt);
        if(!resJson) return;

        container.innerHTML = `
          <div class="result-box">
            <p style="margin-bottom:4px;"><strong>🧪 المثائل (نفس المادة الفعالة):</strong></p>
            <p style="color:#047857; font-weight:800; background:#ecfdf5; padding:8px 12px; border-radius:8px;">${resJson.generics.join(' - ')}</p>
            <hr style="margin:12px 0; border:0; border-top:1px solid #e2e8f0;">
            <p style="margin-bottom:4px;"><strong>🔄 البدائل (نفس التأثير):</strong></p>
            <p style="color:#0f766e; font-weight:800; background:#f0fdf4; padding:8px 12px; border-radius:8px;">${resJson.substitutes.join(' - ')}</p>
          </div>`;
      } catch (err) { alert("خطأ: " + err.message); container.innerHTML = ''; }
    }

    async function askGeminiDerma() {
      const query = document.getElementById('dermaSearchInput').value.trim();
      if(!query) { alert("برجاء كتابة المشكلة أولاً!"); return; }
      
      const container = document.getElementById('aiResultsDerma');
      container.innerHTML = `<div class="loading">⏳ جارِ تحليل الحالة وصياغة الروتين...</div>`;

      try {
        const prompt = `أنت طبيب جلدي. قم بتحليل المشكلة: "${query}". أرجع JSON بالتراكيب: {"diagnosisAndCause": "التشخيص", "routine": {"morning": ["خطوة 1"], "evening": ["خطوة 1"]}}`;
        const resJson = await fetchGemini(prompt);
        if(!resJson) return;

        container.innerHTML = `
          <div class="result-box">
            <p style="margin-bottom:8px;"><strong>🔬 التحليل الطبي:</strong> ${resJson.diagnosisAndCause}</p>
            <div style="background:#f0f9ff; padding:10px 14px; border-radius:10px; margin-top:8px; border:1px solid #bae6fd;">
              <p style="color:#0369a1;"><strong>☀️ الصباح:</strong> ${resJson.routine.morning.join(', ')}</p>
            </div>
            <div style="background:#f8fafc; padding:10px 14px; border-radius:10px; margin-top:8px; border:1px solid #e2e8f0;">
              <p style="color:#334155;"><strong>🌙 المساء:</strong> ${resJson.routine.evening.join(', ')}</p>
            </div>
          </div>`;
      } catch (err) { alert("خطأ: " + err.message); container.innerHTML = ''; }
    }

    async function askGeminiAlgorithm() {
      const query = document.getElementById('algoSearchInput').value.trim();
      if(!query) { alert("برجاء كتابة الحالة الطبية أولاً!"); return; }
      
      const container = document.getElementById('aiResultsAlgo');
      container.innerHTML = `<div class="loading">⏳ جارِ رسم الخريطة الشجرية...</div>`;

      try {
        const prompt = `أنت طبيب استشاري. أنشئ خوارزمية للحالة: "${query}". أرجع JSON: {"conditionTitle": "الحالة", "initialAssessment": "التقييم", "branches": [{"decisionCriteria": "المعيار", "actionStep": "الإجراء"}], "redFlags": ["عرض خطير"]}`;
        const resJson = await fetchGemini(prompt);
        if(!resJson) return;

        let branchesText = resJson.branches.map(b => `<p style="margin-bottom:4px;">• <strong>${b.decisionCriteria}:</strong> ${b.actionStep}</p>`).join('');

        container.innerHTML = `
          <div class="result-box">
            <h3 style="font-size:14px; color:#b45309; font-weight:800;">${resJson.conditionTitle}</h3>
            <p style="margin-bottom:10px;"><strong>📋 التقييم المبدئي:</strong> ${resJson.initialAssessment}</p>
            <div style="background:#fffbeb; padding:12px; border-radius:10px; margin:8px 0; border:1px solid #fef08a; color:#78350f;">${branchesText}</div>
            <p style="color:#b91c1c; margin-top:8px; background:#fef2f2; padding:8px 12px; border-radius:8px; border:1px solid #fecaca;"><strong>⚠️ علامات الخطر (Red Flags):</strong> ${resJson.redFlags.join(', ')}</p>
          </div>`;
      } catch (err) { alert("خطأ: " + err.message); container.innerHTML = ''; }
    }
  </script>
</body>
</html>
