<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم الطبية والصيدلانية - د/ السعيد مسعد v3.7</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; color: #0f172a; }
    .page-content { display: none; }
    .page-content.active { display: block !important; }
    .dash-page { display: block; }
    .dash-page.hidden-dash { display: none !important; }
  </style>
</head>
<body class="pb-12 min-h-screen flex flex-col justify-between">

  <div>
    <!-- Header -->
    <header class="bg-teal-900 text-white p-4 shadow-xl sticky top-0 z-50">
      <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
        <div class="flex items-center gap-3">
          <button id="backBtn" onclick="showDashboard()" class="hidden bg-teal-800 hover:bg-teal-700 text-white text-xs px-3 py-1.5 rounded-xl font-bold transition flex items-center gap-1">
            <span>➡️</span> العودة للرئيسية
          </button>
          <div>
            <h1 id="headerTitle" class="text-lg font-black flex items-center gap-2">
              <span>🩺</span> لوحة التحكم الطبية والصيدلانية
            </h1>
            <p class="text-[11px] text-teal-200 mt-0.5">منصة الدعم السريري والتجميلي بذكاء Gemini AI • <span class="text-amber-300 font-bold">تطوير د/ السعيد مسعد</span></p>
          </div>
        </div>
        <span class="bg-teal-800 border border-teal-700 text-teal-200 text-xs px-3 py-1 rounded-full font-bold">v3.7 🚀</span>
      </div>
    </header>

    <div class="max-w-4xl mx-auto p-4 space-y-4">

      <!-- API Key Section -->
      <div id="apiKeySection" class="bg-amber-50 border border-amber-200 p-3.5 rounded-2xl text-xs flex flex-col gap-2 shadow-sm">
        <span class="font-bold text-amber-900">⚠️ إعدادات الربط بـ Gemini:</span>
        <div class="flex gap-2">
          <input type="password" id="apiKeyInput" placeholder="الصق Gemini API Key هنا..." class="p-2.5 border border-amber-300 rounded-xl w-full text-xs bg-white focus:outline-none focus:ring-2 focus:ring-teal-600" />
          <button id="saveKeyBtn" onclick="saveApiKey()" class="bg-amber-700 text-white px-5 py-2.5 rounded-xl font-bold whitespace-nowrap hover:bg-amber-800 transition">حفظ المفتاح</button>
        </div>
      </div>

      <!-- MAIN DASHBOARD PAGE -->
      <div id="pageDashboard" class="dash-page space-y-4">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
          <h2 class="text-sm font-extrabold text-slate-800">التنقل في لوحة التحكم الرئيسية</h2>
          
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <button onclick="openPage('pageDrug')" class="group p-3 bg-slate-50 border border-teal-500/30 hover:border-teal-600 rounded-xl shadow-sm hover:shadow-md transition-all flex flex-col items-center justify-between text-center h-28 w-full">
              <div class="w-full flex justify-end"><span class="text-slate-400 group-hover:text-teal-600 text-xs">↗</span></div>
              <div class="text-2xl my-auto">💊</div>
              <div>
                <h3 class="font-bold text-xs text-slate-800">المساعد الدوائي</h3>
                <p class="text-[10px] text-slate-500 font-semibold">(Drug Assistant)</p>
              </div>
            </button>

            <button onclick="openPage('pageAlt')" class="group p-3 bg-slate-50 border border-emerald-500/30 hover:border-emerald-600 rounded-xl shadow-sm hover:shadow-md transition-all flex flex-col items-center justify-between text-center h-28 w-full">
              <div class="w-full flex justify-end"><span class="text-slate-400 group-hover:text-emerald-600 text-xs">↗</span></div>
              <div class="text-2xl my-auto">🔄</div>
              <div>
                <h3 class="font-bold text-xs text-slate-800">المثائل والبدائل</h3>
                <p class="text-[10px] text-slate-500 font-semibold">(Generics & Substitutes)</p>
              </div>
            </button>

            <button onclick="openPage('pageDerma')" class="group p-3 bg-slate-50 border border-sky-500/30 hover:border-sky-600 rounded-xl shadow-sm hover:shadow-md transition-all flex flex-col items-center justify-between text-center h-28 w-full">
              <div class="w-full flex justify-end"><span class="text-slate-400 group-hover:text-sky-600 text-xs">↗</span></div>
              <div class="text-2xl my-auto">✨</div>
              <div>
                <h3 class="font-bold text-xs text-slate-800">الشعر والبشرة</h3>
                <p class="text-[10px] text-slate-500 font-semibold">(Hair & Skin Care)</p>
              </div>
            </button>

            <button onclick="openPage('pageAlgo')" class="group p-3 bg-slate-50 border border-amber-500/30 hover:border-amber-600 rounded-xl shadow-sm hover:shadow-md transition-all flex flex-col items-center justify-between text-center h-28 w-full">
              <div class="w-full flex justify-end"><span class="text-slate-400 group-hover:text-amber-600 text-xs">↗</span></div>
              <div class="text-2xl my-auto">🌿</div>
              <div>
                <h3 class="font-bold text-xs text-slate-800">الخوارزميات الطبية</h3>
                <p class="text-[10px] text-slate-500 font-semibold">(Medical Algorithms)</p>
              </div>
            </button>
          </div>
        </div>
      </div>

      <!-- PAGE SECTIONS -->
      <div id="pageDrug" class="page-content space-y-4">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
          <h2 class="font-extrabold text-sm text-teal-900 flex items-center gap-2"><span>💊</span> قسم المساعد الدوائي</h2>
          <div class="flex gap-2">
            <input type="text" id="drugSearchInput" placeholder="مثال: Augmentin 1g..." class="w-full p-2.5 rounded-xl border border-teal-200 focus:outline-none text-xs" />
            <button onclick="askGeminiDrug()" class="bg-teal-700 text-white px-5 py-2.5 rounded-xl font-bold text-xs">بحث 🔍</button>
          </div>
        </div>
        <div id="aiResultsDrug" class="space-y-4"></div>
      </div>

      <div id="pageAlt" class="page-content space-y-4">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
          <h2 class="font-extrabold text-sm text-emerald-900 flex items-center gap-2"><span>🔄</span> قسم البدائل</h2>
          <div class="flex gap-2">
            <input type="text" id="altSearchInput" placeholder="مثال: Congestal..." class="w-full p-2.5 rounded-xl border border-emerald-200 focus:outline-none text-xs" />
            <button onclick="askGeminiAlternatives()" class="bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-bold text-xs">عرض 🔄</button>
          </div>
        </div>
        <div id="aiResultsAlt" class="space-y-4"></div>
      </div>

      <div id="pageDerma" class="page-content space-y-4">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
          <h2 class="font-extrabold text-sm text-sky-900 flex items-center gap-2"><span>✨</span> البشرة والشعر</h2>
          <div class="flex gap-2">
            <input type="text" id="dermaSearchInput" placeholder="مثال: حب الشباب..." class="w-full p-2.5 rounded-xl border border-teal-200 focus:outline-none text-xs" />
            <button onclick="askGeminiDerma()" class="bg-sky-700 text-white px-5 py-2.5 rounded-xl font-bold text-xs">تحليل 💡</button>
          </div>
        </div>
        <div id="aiResultsDerma" class="space-y-4"></div>
      </div>

      <div id="pageAlgo" class="page-content space-y-4">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
          <h2 class="font-extrabold text-sm text-amber-900 flex items-center gap-2"><span>🌿</span> الخوارزميات</h2>
          <div class="flex gap-2">
            <input type="text" id="algoSearchInput" placeholder="مثال: Asthma management..." class="w-full p-2.5 rounded-xl border border-teal-200 focus:outline-none text-xs" />
            <button onclick="askGeminiAlgorithm()" class="bg-amber-700 text-white px-5 py-2.5 rounded-xl font-bold text-xs">رسم 🗺️</button>
          </div>
        </div>
        <div id="aiResultsAlgo" class="space-y-4"></div>
      </div>

    </div>
  </div>

  <script>
    window.onload = function() {
      const savedKey = localStorage.getItem('gemini_api_key');
      if(savedKey && savedKey.length > 5) {
        document.getElementById('apiKeyInput').value = savedKey;
        document.getElementById('apiKeySection').style.display = 'none';
      }
    };

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if(key.length > 5) {
        localStorage.setItem('gemini_api_key', key);
        document.getElementById('apiKeySection').style.display = 'none';
        alert('تم حفظ المفتاح! 🚀');
      }
    }

    function openPage(pageId) {
      document.getElementById('pageDashboard').classList.add('hidden-dash');
      document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      document.getElementById('backBtn').classList.remove('hidden');
    }

    function showDashboard() {
      document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
      document.getElementById('pageDashboard').classList.remove('hidden-dash');
      document.getElementById('backBtn').classList.add('hidden');
    }

    function getApiKey() {
      return localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();
    }

    async function fetchGemini(promptText) {
      const apiKey = getApiKey();
      if(!apiKey) {
        alert("يرجى إدخال API Key أولاً.");
        return null;
      }

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: { responseMimeType: "application/json" } // إجبار الموديل على إرجاع JSON فقط
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates[0].content.parts[0].text;
        return JSON.parse(rawText);

      } catch (err) {
        console.error("Gemini API Error:", err);
        throw err;
      }
    }

    async function askGeminiDrug() {
      const query = document.getElementById('drugSearchInput').value.trim();
      const container = document.getElementById('aiResultsDrug');
      if(!query) return;

      container.innerHTML = `<div class="bg-white p-4 rounded-xl text-center text-xs">⏳ جاري التحليل...</div>`;
      try {
        const prompt = `أنت صيدلي خبير. أرجع JSON فقط بهذا الشكل لـ "${query}": {"name": "الاسم", "activeIngredients": ["المادة"], "indications": "دواعي الاستعمال", "dosageAndUsage": "الجرعة"}`;
        const res = await fetchGemini(prompt);
        if(!res) return;

        let ing = res.activeIngredients.map(i => `<li>• ${i}</li>`).join('');
        container.innerHTML = `<div class="bg-white p-4 rounded-xl space-y-2 text-xs border">
          <h3 class="font-bold text-sm text-teal-800">${res.name}</h3>
          <p><strong>المكونات:</strong> <ul>${ing}</ul></p>
          <p><strong>دواعي الاستعمال:</strong> ${res.indications}</p>
          <p><strong>الجرعة:</strong> ${res.dosageAndUsage}</p>
        </div>`;
      } catch(e) {
        container.innerHTML = `<div class="bg-red-50 p-3 rounded-xl text-red-600 text-xs">❌ خطأ: ${e.message}</div>`;
      }
    }

    async function askGeminiAlternatives() {
      const query = document.getElementById('altSearchInput').value.trim();
      const container = document.getElementById('aiResultsAlt');
      if(!query) return;

      container.innerHTML = `<div class="bg-white p-4 rounded-xl text-center text-xs">⏳ جاري التحميل...</div>`;
      try {
        const prompt = `أرجع JSON فقط للبدائل والمثائل للدواء "${query}": {"generics": ["مثيل 1"], "substitutes": ["بديل 1"]}`;
        const res = await fetchGemini(prompt);
        if(!res) return;

        let gen = res.generics.map(i => `<li>• ${i}</li>`).join('');
        let sub = res.substitutes.map(i => `<li>• ${i}</li>`).join('');
        container.innerHTML = `<div class="bg-white p-4 rounded-xl space-y-2 text-xs border">
          <p class="font-bold text-emerald-800">المثائل (Generics):</p><ul>${gen}</ul>
          <p class="font-bold text-teal-800">البدائل (Substitutes):</p><ul>${sub}</ul>
        </div>`;
      } catch(e) {
        container.innerHTML = `<div class="bg-red-50 p-3 rounded-xl text-red-600 text-xs">❌ خطأ: ${e.message}</div>`;
      }
    }

    async function askGeminiDerma() {
      const query = document.getElementById('dermaSearchInput').value.trim();
      const container = document.getElementById('aiResultsDerma');
      if(!query) return;

      container.innerHTML = `<div class="bg-white p-4 rounded-xl text-center text-xs">⏳ جاري التحليل...</div>`;
      try {
        const prompt = `أنت طبيب جلدية. أرجع JSON فقط للحالة "${query}": {"diagnosisAndCause": "السبب", "egyptianProducts": [{"name": "اسم المنتج", "category": "النوع", "note": "ملاحظة"}]}`;
        const res = await fetchGemini(prompt);
        if(!res) return;

        let prod = res.egyptianProducts.map(p => `<div>• <strong>${p.name}</strong> (${p.category}) - ${p.note}</div>`).join('');
        container.innerHTML = `<div class="bg-white p-4 rounded-xl space-y-2 text-xs border">
          <p><strong>السبب والتشخيص:</strong> ${res.diagnosisAndCause}</p>
          <p><strong>المنتجات:</strong></p>${prod}
        </div>`;
      } catch(e) {
        container.innerHTML = `<div class="bg-red-50 p-3 rounded-xl text-red-600 text-xs">❌ خطأ: ${e.message}</div>`;
      }
    }

    async function askGeminiAlgorithm() {
      const query = document.getElementById('algoSearchInput').value.trim();
      const container = document.getElementById('aiResultsAlgo');
      if(!query) return;

      container.innerHTML = `<div class="bg-white p-4 rounded-xl text-center text-xs">⏳ جاري رسم الخارطة...</div>`;
      try {
        const prompt = `أنت طبيب استشاري. أرجع JSON لخوارزمية علاج "${query}": {"conditionTitle": "الحالة", "branches": [{"decisionCriteria": "المعيار", "actionStep": "الإجراء"}]}`;
        const res = await fetchGemini(prompt);
        if(!res) return;

        let b = res.branches.map(x => `<div>📌 <strong>${x.decisionCriteria}:</strong> ${x.actionStep}</div>`).join('');
        container.innerHTML = `<div class="bg-white p-4 rounded-xl space-y-2 text-xs border">
          <h3 class="font-bold text-amber-900">${res.conditionTitle}</h3>${b}
        </div>`;
      } catch(e) {
        container.innerHTML = `<div class="bg-red-50 p-3 rounded-xl text-red-600 text-xs">❌ خطأ: ${e.message}</div>`;
      }
    }
  </script>
</body>
</html>
